<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mağaza | İçin Yapı & Dekorasyon</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
            padding: 0;
        }

        body {

            background-color: #120b06;

            background-image: url("./images/magaza.png");

            background-size: cover;

            background-position: center top;

            background-attachment: fixed;

            background-repeat: no-repeat;

        }


        /* MAĞAZA GÖRSELİ */

        .magaza {

            position: relative;

            width: 100%;

        }

        .magaza img {

            width: 100%;

            height: auto;

            display: block;

        }


        /* TIKLANABİLİR BUTONLAR */

        .magaza-buton {

            position: absolute;

            display: block;

            cursor: pointer;

            text-decoration: none;

            border: 2px solid transparent;

            border-radius: 20px;

            transition: 0.3s;

        }


        /* ÜZERİNE GELİNCE TURUNCU ÇERÇEVE */

        .magaza-buton:hover {

            border: 2px solid #ff7200;

            background: rgba(255, 114, 0, 0.10);

            box-shadow: 0 0 25px rgba(255, 114, 0, 0.45);

        }


        /* 
        BANYO DOLAPLARI
        */

        .banyo {

            left: 7%;

            top: 44%;

            width: 20%;

            height: 40%;

        }


        /*
        MUTFAK DOLAPLARI
        */

        .mutfak {

            left: 29%;

            top: 44%;

            width: 21%;

            height: 40%;

        }


        /*
        KLOZETLER
        */

        .klozet {

            left: 52%;

            top: 44%;

            width: 21%;

            height: 40%;

        }


        /*
        AKSESUARLAR
        */

        .aksesuar {

            left: 74%;

            top: 44%;

            width: 20%;

            height: 40%;

        }

    </style>

</head>


<body>


    <div class="magaza">


        <!-- MAĞAZA GÖRSELİ -->

        <img
            src="./images/magaza.png"
            alt="İçin Yapı & Dekorasyon Mağaza"
        >


        <!-- BANYO DOLAPLARI -->

        <a
            href="banyo-dolaplari.html"
            class="magaza-buton banyo"
            title="Banyo Dolapları"
        ></a>


        <!-- MUTFAK DOLAPLARI -->

        <a
            href="mutfak-dolaplari.html"
            class="magaza-buton mutfak"
            title="Mutfak Dolapları"
        ></a>


        <!-- KLOZETLER -->

        <a
            href="klozetler.html"
            class="magaza-buton klozet"
            title="Klozetler"
        ></a>


        <!-- AKSESUARLAR -->

        <a
            href="aksesuarlar.html"
            class="magaza-buton aksesuar"
            title="Aksesuarlar"
        ></a>


    </div>


</body>

</html>
